    <style>
        :root {
            --bg: #050814;
            --card-bg: rgba(13, 20, 40, 0.85);
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.45);
            --accent-purple: #7000ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(112, 0, 255, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 240, 255, 0.15) 0%, transparent 60%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            padding: 16px;
        }

        .wrapper {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
        }

        /* Live Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 11px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.15);
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary);
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }

        /* Profile Photo */
        .avatar-wrap {
            position: relative;
            width: 115px;
            height: 115px;
            margin-top: 4px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            box-shadow: 0 0 30px var(--primary-glow), 0 0 10px var(--accent-purple);
        }

        /* Title & Subtitle */
        .main-title {
            font-size: 28px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
        }

        .sub-title {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: -8px;
            font-weight: 500;
        }

        /* Line Divider */
        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), var(--accent-purple), transparent);
        }

        /* CTA Link Button */
        .cta-link {
            width: 100%;
            display: block;
            padding: 16px 20px;
            background: linear-gradient(135deg, #00f0ff 0%, #7000ff 100%);
            color: #ffffff;
            font-size: 19px;
            font-weight: 900;
            text-decoration: none;
            text-align: center;
            letter-spacing: 1px;
            border-radius: 14px;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            animation: glow 1.8s infinite;
            transition: transform 0.15s ease;
        }

        .cta-link:active {
            transform: scale(0.98);
        }

        @keyframes glow {
            0% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
            50% { box-shadow: 0 0 32px rgba(0, 240, 255, 0.75); }
            100% { box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
        }

        /* Timer Card */
        .timer-box {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 16px;
            padding: 16px;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 15px rgba(112, 0, 255, 0.1);
        }

        .timer-head {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .timer-clock {
            font-size: 30px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 2px;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .timer-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            gap: 10px;
            margin-top: 2px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid rgba(112, 0, 255, 0.3);
            padding: 12px 6px;
            border-radius: 12px;
        }

        .stat-val {
            font-size: 17px;
            font-weight: 800;
            color: var(--primary);
        }

        .stat-lbl {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
            font-weight: 600;
        }

        /* Footer */
        .footer {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
            line-height: 1.5;
        }

        .footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>

    <!-- Timer Script -->
    <script>
        var timeLeft = 15;
